<body>

  <script>
    const variants={orbital:{label:"A · Orbital Galaxy",render:renderOrbital},atlas:{label:"B · Cluster Atlas",render:renderAtlas},constellation:{label:"C · Constellation Focus",render:renderConstellation}};
    const keys=Object.keys(variants);const params=new URLSearchParams(location.search);let current=keys.includes(params.get("variant"))?params.get("variant"):"orbital";
    function shell(title,sub,body,mode){return `<div class="field-label"><h1>${title}</h1><p>${sub}</p></div><div class="mode"><b>${mode}</b>synthetic study · 2026-08-16</div>${body}`}
    const orbitalNodes=[
      {id:"memory-daily",label:"Daily AI concept",kind:"Memory",className:"memory",community:"Daily learning",state:"Verified outcome",origin:"Routine: daily learning",connected:"4 relationships"},
      {id:"memory-operator",label:"Operator habits",kind:"Memory",className:"memory",community:"Operator habits",state:"Retained knowledge",origin:"Conversation",connected:"6 relationships"},
      {id:"work-release",label:"Prepare release evidence",kind:"Responsibility",className:"work",community:"Work",state:"Needs you",origin:"Today journal",connected:"3 relationships"},
      {id:"routine-learning",label:"Daily learning",kind:"Routine",className:"routine",community:"Routines",state:"Scheduled",origin:"Recurring routine",connected:"5 relationships"},
      {id:"routine-backup",label:"Backup verification",kind:"Routine",className:"routine",community:"Routines",state:"Waiting",origin:"System schedule",connected:"2 relationships"},
      {id:"work-galaxy",label:"Galaxy direction",kind:"Responsibility",className:"work",community:"Work",state:"Working",origin:"Planning conversation",connected:"4 relationships"},
      {id:"chat-visual",label:"Visual language discussion",kind:"Conversation",className:"chat",community:"Conversations",state:"Recorded",origin:"Dashboard conversation",connected:"3 relationships"},
      {id:"work-health",label:"Runtime health",kind:"Responsibility",className:"work",community:"System",state:"Verified",origin:"System check",connected:"7 relationships"},
      {id:"memory-galaxy",label:"Galaxy map decision",kind:"Memory",className:"memory",community:"Product decisions",state:"Verified outcome",origin:"Planning conversation",connected:"5 relationships"}
    ];
    function renderOrbital(){return shell("Universe","A quiet 3D field for exploring what Mino carries.",`<div class="orbit-tools"><label><span class="sr-only">Search the Galaxy</span><input id="orbit-search" type="search" placeholder="Find in Mino…" autocomplete="off"></label><button id="orbit-fallback" type="button">2D fallback</button><button id="orbit-activity" type="button">Show activity</button></div><div class="search-results" id="orbit-results" hidden></div><div class="stage" id="orbit-stage"><div class="orbit"></div><div class="orbit two"></div><div class="core"><span><strong>Mino</strong><small>owner world</small></span></div>${orbitalNodes.map((node,i)=>`<button class="node n${i+1} ${node.className}" data-node="${node.id}" aria-label="${node.kind}: ${node.label}"></button>`).join("")}<div class="link l1"></div><div class="link l2"></div><div class="link l3"></div><div class="link l4"></div><div class="link l5"></div></div><aside class="inspector" id="orbit-inspector"><h2>Daily AI concept</h2><p>New memory · verified today</p><span class="tag">Memory · community 07</span><dl><dt>Connected</dt><dd>4 relationships</dd><dt>Origin</dt><dd>Routine: daily learning</dd><dt>State</dt><dd>Verified outcome</dd></dl><button class="inspect-action">Open memory details →</button></aside><div class="legend"><span><i class="m"></i>Memory</span><span><i class="w"></i>Responsibility</span><span><i class="r"></i>Routine</span></div><div class="timeline"><div class="timeline-line"></div><div class="timeline-label"><span>2026-08-01</span><b>LIVE</b></div></div><div class="state-note" id="orbit-state">Overview · 9 synthetic entities · focused edges hidden</div>`,`GUIDED ORBIT`)}
    function renderAtlas(){return shell("Universe","Communities first. Nodes appear when the field has a reason to show them.",`<div class="atlas"><section class="atlas-field"><div class="island a">Memory communities<small>48 nodes · 12 links</small></div><div class="island b">Responsibilities<small>8 active · 3 waiting</small></div><div class="island c">Routines<small>14 recurring</small></div><div class="island d">Conversations<small>21 threads</small></div><div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></section><aside class="atlas-side"><h2>Explore the field</h2><p>Choose a community to zoom in. The overview stays calm and fast.</p><div class="region"><strong>Memory communities</strong><small>48 durable nodes</small><button>Focus →</button></div><div class="region"><strong>Responsibilities</strong><small>8 active outcomes</small><button>Focus →</button></div><div class="region"><strong>Routines</strong><small>14 recurring paths</small><button>Focus →</button></div><div class="region"><strong>Conversations</strong><small>21 linked threads</small><button>Focus →</button></div></aside></div>`,`CLUSTER ATLAS`)}
    function renderConstellation(){return shell("Memory community 07","A focused constellation with every relationship readable.",`<div class="constellation"><aside class="const-list"><h2>Communities</h2><button class="active">Daily learning<small>12 nodes · 4 links</small></button><button>Operator habits<small>9 nodes · 7 links</small></button><button>Product decisions<small>18 nodes · 12 links</small></button><button>Open questions<small>6 nodes · 3 links</small></button></aside><section class="const-stage"><div class="const-title"><h2>Daily learning</h2><p>One community · stable positions · selected context</p></div><div class="line x"></div><div class="line y"></div><div class="line z"></div><button class="node a selected" aria-label="Selected synthetic memory"></button><button class="node b memory" aria-label="Synthetic related memory"></button><button class="node c work" aria-label="Synthetic related responsibility"></button><button class="node d routine" aria-label="Synthetic related routine"></button><button class="node e chat" aria-label="Synthetic related conversation"></button></section><aside class="const-detail"><h2>Daily AI concept</h2><p>Selected memory · verified outcome</p><div class="event"><time>Today · 21:31</time>Added from the daily learning routine.</div><div class="event"><time>Connected</time>One responsibility, two routines, one conversation.</div><button>Open full evidence</button></aside></div>`,`FOCUSED CONSTELLATION`)}
    function wireOrbital(){
      const input=document.getElementById("orbit-search");if(!input)return;
      const results=document.getElementById("orbit-results"),stage=document.getElementById("orbit-stage"),inspector=document.getElementById("orbit-inspector"),stateNote=document.getElementById("orbit-state");let timer;
      const renderResults=matches=>{results.innerHTML=matches.length?matches.map(node=>`<button type="button" data-result="${node.id}">${node.label}<small>${node.kind} · ${node.community}</small></button>`).join(""):`<p>No matching memory. The field stays where it is.</p>`;results.hidden=!input.value.trim();results.querySelectorAll("[data-result]").forEach(button=>button.onclick=()=>focusNode(button.dataset.result));};
      const focusNode=id=>{const node=orbitalNodes.find(item=>item.id===id);if(!node)return;document.querySelectorAll(".node").forEach(button=>button.classList.toggle("dim",button.dataset.node!==id));const button=document.querySelector(`[data-node="${id}"]`);button?.classList.add("focused");inspector.innerHTML=`<h2>${node.label}</h2><p>${node.kind} · selected from search</p><span class="tag">${node.community}</span><dl><dt>Connected</dt><dd>${node.connected}</dd><dt>Origin</dt><dd>${node.origin}</dd><dt>State</dt><dd>${node.state}</dd></dl><button class="inspect-action">Open canonical details →</button>`;stage.classList.add("focused");stateNote.textContent=`Entity focus · ${node.id} · local paths revealed · revision synthetic-07`;results.hidden=true;input.value=node.label;history.replaceState(null,"",`?variant=orbital&node=${encodeURIComponent(id)}`);};
      input.oninput=()=>{clearTimeout(timer);const query=input.value.trim().toLowerCase();timer=setTimeout(()=>renderResults(query?orbitalNodes.filter(node=>`${node.label} ${node.kind} ${node.community}`.toLowerCase().includes(query)):[]),260);};
      document.querySelectorAll(".node").forEach(button=>button.onclick=()=>focusNode(button.dataset.node));
      document.getElementById("orbit-fallback").onclick=event=>{const fallback=stage.classList.toggle("fallback");event.currentTarget.classList.toggle("on",fallback);event.currentTarget.textContent=fallback?"WebGL2 target":"2D fallback";stateNote.textContent=fallback?"Capability fallback · 2D canvas-style projection · same focus contract":"Overview · native WebGL2 target · instanced nodes · focused edges hidden";};
      document.getElementById("orbit-activity").onclick=()=>{stage.insertAdjacentHTML("beforeend","<div class=\"trail\" aria-hidden=\"true\"></div>");stateNote.textContent="Activity event · finite localized trail · no ambient motion";setTimeout(()=>stage.querySelector(".trail")?.remove(),1800);};
    }
    function update(){document.getElementById("main").innerHTML=variants[current].render();document.getElementById("variant-name").textContent=variants[current].label;history.replaceState(null,"",`?variant=${current}`);wireOrbital()}
    function cycle(step){current=keys[(keys.indexOf(current)+step+keys.length)%keys.length];update()}document.getElementById("prev").onclick=()=>cycle(-1);document.getElementById("next").onclick=()=>cycle(1);document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA","BUTTON"].includes(document.activeElement.tagName))return;if(e.key==="ArrowLeft")cycle(-1);if(e.key==="ArrowRight")cycle(1)});update();
  </script>
</body>
</html>
