name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
	platform-build:
	  runs-on: ubuntu-latest
	  strategy:
	    matrix:
	      include:
	        - { goos: linux, goarch: amd64 }
	        - { goos: darwin, goarch: amd64 }
	        - { goos: darwin, goarch: arm64 }
	        - { goos: windows, goarch: amd64 }
	  steps:
	    - uses: actions/checkout@v4
	    - uses: actions/setup-go@v5
	      with:
	        go-version-file: go.mod
	    - name: Cross-build
	      run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -buildvcs=false -tags sqlite_fts5 .

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt (changed files only)
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          files=$(git diff --name-only --diff-filter=ACMRT "$BASE" HEAD -- '*.go')
          if [ -z "$files" ]; then
            echo "no .go files changed — gate skipped"
            exit 0
          fi
          unformatted=$(gofmt -l $files)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on changed files (run gofmt -w on these):"
            echo "$unformatted"
            exit 1
          fi
          echo "all changed .go files gofmt-clean"

      - name: Test
        run: go test -count=1 ./...

      - name: Race test
        run: go test -count=1 -race -tags sqlite_fts5 ./...

      - name: Vet
        run: go vet -tags sqlite_fts5 ./...

      - name: Build
        run: go build -trimpath -buildvcs=false -tags sqlite_fts5 .

  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test extensions
        run: |
          for ext in minowrap threads cost-watch mino-memory; do
            (cd extensions/$ext && go test -count=1 ./...)
          done

  extensions-platform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-build extensions
        run: |
          for ext in minowrap threads cost-watch mino-memory; do
            (cd extensions/$ext && GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o /tmp/$ext .)
          done
